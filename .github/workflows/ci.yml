name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 64-bit (Memory64 / wasm64) build. wasm64-unknown-unknown is a Tier 3
      # target with no prebuilt std, so it needs nightly + rust-src + build-std.
      # build.sh --memory64 drives the whole compile (cargo build-std +
      # wasm-bindgen). Safari has no Memory64 support and will not load this
      # module — that is an accepted trade-off; we ship 64-bit only.
      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Build sassy-wasm (64-bit / Memory64)
        run: ./build.sh --memory64 --skip-app

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24+ is required: its V8 accepts the 64-bit funcref table that
          # wasm-bindgen emits for the Memory64 module. Node 22's V8 rejects it
          # ("invalid table elements limits flags") and cannot instantiate it.
          node-version: 24

      - name: Install app dependencies
        working-directory: app
        run: npm install

      - name: Build app
        working-directory: app
        run: npm run build

      - name: Lint app
        working-directory: app
        run: npm run lint

      - name: Run WASM unit tests
        run: node tests/wasm_tests.mjs

      - name: Install Playwright browser
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: app
        run: npm run test:e2e

      - name: Install sassy CLI for correctness test
        run: RUSTFLAGS="-C target-cpu=native" cargo install sassy

      - name: Run correctness test
        working-directory: tests
        run: |
          npm install
          node correctness.mjs
