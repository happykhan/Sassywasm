name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ship the 64-bit (Memory64 / wasm64) module. Needs nightly + rust-src
      # for the Tier 3 wasm64-unknown-unknown target (build-std). Safari has no
      # Memory64 support and will not load the deployed site — accepted
      # trade-off; 64-bit only.
      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Build sassy-wasm (64-bit / Memory64)
        run: ./build.sh --memory64 --skip-app

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22+ is required to instantiate a Memory64 WebAssembly module.
          node-version: 22

      - name: Install app dependencies
        working-directory: app
        run: npm install

      - name: Run WASM tests
        run: node tests/wasm_tests.mjs

      - name: Build app
        working-directory: app
        run: npm run build

      - name: Add .nojekyll
        run: touch app/dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/dist
