name: Release WASM

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Release the 64-bit (Memory64 / wasm64) module. Needs nightly + rust-src
      # for the Tier 3 wasm64-unknown-unknown target (build-std).
      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Build sassy-wasm (64-bit / Memory64)
        run: ./build.sh --memory64 --skip-app

      - name: Create GitHub release with WASM assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sassy-wasm/pkg/sassy_wasm.js
            sassy-wasm/pkg/sassy_wasm.d.ts
            sassy-wasm/pkg/sassy_wasm_bg.wasm
            sassy-wasm/pkg/sassy_wasm_bg.wasm.d.ts
          generate_release_notes: true
